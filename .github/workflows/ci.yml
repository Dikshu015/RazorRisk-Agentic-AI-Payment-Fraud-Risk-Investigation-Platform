name: CI

on:
  push:
    branches: ["main", "ci-cd/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run full test suite
        env:
          DATABASE_URL: sqlite:////tmp/razorrisk_ci.db
          REDIS_REQUIRED: "false"
          DEBUG: "false"
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q agent api db infra ml utils

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build application image
        run: docker build --tag razorrisk:ci .
