services:
  - type: web
    name: razor-risk-app
    env: python
    buildCommand: "pip install -r requirements.txt && python data/generate_synthetic_data.py && python ml/train_tabular_model.py && python ml/train_gnn.py"
    startCommand: "python run.py"
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: "sqlite:///./razor_risk.db"
