[project]
name = "razor-version"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dikshu015", email = "kaushikdikshu78@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.3",
    "langchain>=0.1.10",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.0.25",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.0.26",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.28.0",
    "xgboost>=2.0.0",
]

[project.scripts]
razor-version = "razor_version:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
